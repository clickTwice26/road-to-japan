# Tooling configuration only. Runtime dependencies are pinned in
# requirements.txt / requirements-dev.txt so Docker layers cache cleanly.

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app", "tests"]
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "BLE",      # no blind `except Exception` outside probes
    "C4",       # comprehensions
    "SIM",      # simplify
    "S",        # bandit
    "RUF",      # ruff-specific
]
ignore = [
    "E501",   # line length is enforced by the formatter
    "B008",   # function call in default arg — normal in Flask/pydantic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]   # asserts and hardcoded test passwords
"app/config.py" = ["N802", "N815"]     # Flask config keys are SCREAMING_CASE
"migrations/*" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 100
target-version = ["py314"]
extend-exclude = "migrations/versions"

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "integration: requires a live Postgres and Redis",
]
filterwarnings = ["error", "ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

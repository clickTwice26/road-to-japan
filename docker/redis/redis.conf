# ---------------------------------------------------------------------------
# Redis configuration for local/dev use.
# In production, set `requirepass` (or use ACLs) and enable TLS.
# ---------------------------------------------------------------------------

bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# --- Memory ----------------------------------------------------------------
maxmemory 256mb
# Cache DB 0 is expendable; volatile-lru would strand keys written without a
# TTL, so evict the least-recently-used key regardless.
maxmemory-policy allkeys-lru

# --- Persistence -----------------------------------------------------------
# AOF with per-second fsync: at most one second of writes lost on a hard crash,
# without the throughput cost of fsync-per-write.
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots as a second line of defence.
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# --- Logging ---------------------------------------------------------------
loglevel notice

# --- Safety ----------------------------------------------------------------
# Disable the cross-database wipe. FLUSHDB and KEYS stay available: Flask-Caching
# implements `cache.clear()` with a prefixed KEYS scan, so disabling those would
# break the `flask flush-cache` command.
rename-command FLUSHALL ""
